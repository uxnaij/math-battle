    let audioCtx = null;
    function playTone(type) {
      if (!state.soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        if (type === 'hit') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(560, now + 0.14);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
          osc.start(now); osc.stop(now + 0.16);
        } else if (type === 'ultimate') {
          [330, 440, 554.37, 659.25, 880].forEach((freq, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(freq, now + idx * 0.06);
            g.gain.setValueAtTime(0.14, now + idx * 0.06);
            g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.06 + 0.25);
            o.start(now + idx * 0.06); o.stop(now + idx * 0.06 + 0.25);
          });
        } else if (type === 'wrong') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(170, now);
          osc.frequency.linearRampToValueAtTime(105, now + 0.24);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'win') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, now + idx * 0.11);
            g.gain.setValueAtTime(0.15, now + idx * 0.11);
            g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.11 + 0.24);
            o.start(now + idx * 0.11); o.stop(now + idx * 0.11 + 0.24);
          });
        }
      } catch (e) {}
    }

    function pickQuestion(excludeIds = [], mode = 'mixed') {
      const modePool = getPoolByMode(mode);
      const pool = modePool.filter(q => !excludeIds.includes(q.id));
      const source = pool.length > 0 ? pool : modePool;
      const wordPool = source.filter(q => q.id.startsWith('w'));
      const numPool = source.filter(q => !q.id.startsWith('w'));
      const pickFrom = (Math.random() < 0.45 && wordPool.length > 0) ? wordPool : (numPool.length > 0 ? numPool : source);
      const q = pickFrom[Math.floor(Math.random() * pickFrom.length)];
      const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
      return { ...q, shuffledOptions, startedAt: Date.now() };
    }

    function initGroups(mode = 'mixed') {
      const used = [];
      return GROUPS_META.map(meta => {
        const q = pickQuestion(used, mode);
        used.push(q.id);
        return {
          ...meta,
          damage: 0,
          combo: 0,
          correctCount: 0,
          wrongCount: 0,
          currentRunner: 1,
          ultimateCount: 0,
          question: q,
          eliminatedOptions: [],
          freezeUntil: 0
        };
      });
    }

    let state = {
      mode: 'mixed',
      maxHp: 10000,
      hp: 10000,
      paused: false,
      ended: false,
      soundEnabled: true,
      bannerText: '【混合模式】固定 6 棒接力制！輪完第 6 棒發動「合體大招 +1000 傷」！',
      monsterHit: false,
      floatingDamages: [],
      ultimateAlert: null,
      errorLogs: [],
      reviewTab: 'byQuestion',
      selectedReviewQId: null,
      showHintInReview: false,
      groups: initGroups('mixed')
    };

    function getSpeedMultiplier(startedAt) {
      const elapsedSec = (Date.now() - startedAt) / 1000;
      if (elapsedSec <= 15) return { mult: 1.5, label: '神速 ×1.5', barClass: 'bg-emerald-400', pct: Math.max(15, 100 - (elapsedSec / 30) * 100) };
      if (elapsedSec <= 30) return { mult: 1.2, label: '敏捷 ×1.2', barClass: 'bg-amber-400', pct: Math.max(8, 100 - (elapsedSec / 30) * 100) };
      return { mult: 1.0, label: '穩定 ×1.0', barClass: 'bg-rose-400', pct: 8 };
    }

    function spawnFloatingDamage(groupId, amount, isUltimate = false) {
      const id = Date.now() + Math.random();
      const leftPct = 10 + (groupId - 1) * 20;
      state.floatingDamages.push({ id, amount, leftPct, isUltimate });
      render();
      setTimeout(() => {
        state.floatingDamages = state.floatingDamages.filter(f => f.id !== id);
        render();
      }, 1050);
    }

    function triggerUltimateBanner(groupName, teamName) {
      state.ultimateAlert = `🔥 ${groupName}（${teamName}）6 棒接力完成！發動合體大招 -${ULTIMATE_BONUS_DAMAGE}！`;
      render();
      setTimeout(() => {
        state.ultimateAlert = null;
        render();
      }, 1800);
    }

    function handleAnswer(groupId, chosenValue) {
      if (state.paused || state.ended) return;
      const g = state.groups.find(item => item.id === groupId);
      if (!g) return;
      const now = Date.now();
      if (g.freezeUntil > now) return;
      if (g.eliminatedOptions.includes(chosenValue)) return;

      const activeIds = state.groups.map(item => item.question.id);
      const runnerNo = g.currentRunner;

      if (chosenValue === g.question.answer) {
        const { mult } = getSpeedMultiplier(g.question.startedAt);
        const comboBonus = 1 + Math.min(g.combo, 5) * 0.05;
        const baseHit = Math.round(STAR_BASE_DAMAGE[g.question.stars] * mult * comboBonus);

        const completedFullLap = runnerNo >= TEAM_SIZE;
        const bonusDmg = completedFullLap ? ULTIMATE_BONUS_DAMAGE : 0;
        const totalAttemptDmg = baseHit + bonusDmg;
        const actualDmg = Math.min(state.hp, totalAttemptDmg);

        g.damage += actualDmg;
        g.combo += 1;
        g.correctCount += 1;
        g.eliminatedOptions = [];
        state.hp = Math.max(0, state.hp - actualDmg);
        state.monsterHit = true;

        if (completedFullLap) {
          g.currentRunner = 1;
          g.ultimateCount += 1;
          state.bannerText = `💥 ${g.name}第 6 棒壓軸命中！全員輪完一輪，發動合體大招暴擊 ${actualDmg} 傷！請換第 1 棒準備！`;
          playTone('ultimate');
          spawnFloatingDamage(g.id, actualDmg, true);
          triggerUltimateBanner(g.name, g.team);
        } else {
          g.currentRunner = runnerNo + 1;
          state.bannerText = `⚔️ ${g.name}第 ${runnerNo} 棒答對（-${actualDmg} 傷）！請交棒給【第 ${g.currentRunner} 棒】上台！`;
          playTone('hit');
          spawnFloatingDamage(g.id, actualDmg, false);
        }

        setTimeout(() => {
          state.monsterHit = false;
          render();
        }, 360);

        if (state.hp <= 0) {
          state.ended = true;
          playTone('win');
          const topErr = getWrongQuestionStats()[0];
          state.selectedReviewQId = topErr ? topErr.question.id : null;
          render();
          return;
        }

        g.question = pickQuestion(activeIds, state.mode);
        render();
      } else {
        g.combo = 0;
        g.wrongCount += 1;
        g.eliminatedOptions.push(chosenValue);
        g.freezeUntil = now + 4000;
        state.bannerText = `❄️ ${g.name}第 ${runnerNo} 棒誤選「${chosenValue}」，冷卻 4 秒！台下組員快幫忙檢查算式！`;
        playTone('wrong');
        state.errorLogs.push({
          id: now + Math.random(),
          groupId: g.id,
          groupName: `${g.name}（第 ${runnerNo} 棒）`,
          question: g.question,
          chosenValue,
          correctAnswer: g.question.answer
        });
        render();
      }
    }

  let pausedAt = null;

    function setPausedState(nextPaused) {
      if (nextPaused && !state.paused) {
        pausedAt = Date.now();
        state.paused = true;
      } else if (!nextPaused && state.paused) {
        if (pausedAt) {
          const pausedDuration = Date.now() - pausedAt;
          state.groups.forEach(g => {
            g.question.startedAt += pausedDuration;
            if (g.freezeUntil > 0) {
              g.freezeUntil += pausedDuration;
            }
          });
          pausedAt = null;
        }
        state.paused = false;

    }

    function resetGame(newMaxHp = state.maxHp, newMode = state.mode) {

        monsterHit: false,

        ultimateAlert: null,

    function finishBattleNow() {
      state.ended = true;

      state.selectedReviewQId = topErr ? topErr.question.id : null;

    function getWrongQuestionStats() {
      const map = new Map();
      for (const log of state.errorLogs) {
        const qid = log.question.id;
        if (!map.has(qid)) {
          map.set(qid, {
            question: log.question,
            wrongCount: 0,
            attempts: []
          });
        }
        const entry = map.get(qid);
        entry.wrongCount += 1;
        entry.attempts.push({ groupName: log.groupName, chosenValue: log.chosenValue });
      }
      return Array.from(map.values()).sort((a, b) => b.wrongCount - a.wrongCount);
    }

            ${state.errorLogs.length === 0 ? `
              <div class="flex-1 flex flex-col items-center justify-center text-center py-8">

                <p class="text-slate-400 text-sm mt-1">沒有錯題需要檢討，可以直接調高怪獸血量再戰一回合！</p>
              </div>
            ` : state.reviewTab === 'byQuestion' ? `
              <div class="grid grid-cols-12 gap-3 flex-1">
                <div class="col-span-5 flex flex-col gap-2 max-h-[340px] overflow-y-auto pr-1">
                  ${wrongStats.map(item => {
                    const isSelected = activeStat && activeStat.question.id === item.question.id;
                    return `
                      <button onclick="state.selectedReviewQId='${item.question.id}'; state.showHintInReview=false; render();"
                        class="text-left p-3 rounded-xl border transition cursor-pointer ${isSelected ? 'bg-indigo-500/20 border-indigo-400' : 'bg-slate-800/70 border-slate-700 hover:border-slate-500'}">

              </div>
            `}
          </div>
        </div>

                <svg viewBox="0 0 120 120" class="w-9 h-9">

        <div class="flex-1 grid grid-cols-5 gap-2 min-h-0">

                  <div class="absolute inset-0 z-20 bg-slate-950/88 backdrop-blur-[2px] flex flex-col items-center justify-center p-3 text-center">
                    <div class="text-3xl mb-1">❄️</div>
                    <div class="text-sky-300 font-black text-lg">第 ${g.currentRunner} 棒冷卻中</div>
                    <div class="text-3xl font-black text-white mt-0.5">${remainSec} 秒</div>
                    <div class="text-xs md:text-sm text-slate-300 mt-1">組員快教第 ${g.currentRunner} 棒怎麼算！</div>
                  </div>
                ` : ''}

                ${state.paused ? `
                  <div class="absolute inset-0 z-20 bg-slate-950/75 flex items-center justify-center font-black text-amber-300 text-xl">
                    ⏸ 遊戲已暫停
                  </div>
                ` : ''}

                <div class="bg-gradient-to-r ${g.headerBg} px-2.5 py-1.5 text-white">
                  <div class="flex items-center justify-between gap-1">
                    <span class="font-black text-base lg:text-lg truncate">${g.name} · ${g.team}</span>
                    <span class="font-black text-xs lg:text-sm bg-black/30 px-2 py-0.5 rounded-lg shrink-0">⚔️ ${g.damage}</span>
                  </div>
                  <div class="flex items-center justify-between text-xs text-white/95 mt-0.5">
                    <span>🔥 連擊 ${g.combo} · 大招×${g.ultimateCount}</span>
                    <span class="font-bold">${speed.label}</span>
                  </div>
                  <div class="w-full h-1.5 bg-black/30 rounded-full overflow-hidden mt-1">
                    <div style="width: ${speed.pct}%" class="h-full ${speed.barClass} transition-all duration-500"></div>
                  </div>
                </div>

                <!-- 固定 6 棒接力進度列 -->
                <div class="px-2 py-1.5 bg-slate-950/90 border-b border-slate-800 flex items-center justify-between gap-1">
                  <span class="text-xs lg:text-sm font-black px-2 py-0.5 rounded-md border ${isUltimateReady ? 'bg-amber-400 text-slate-950 border-amber-200 animate-pulse' : g.batonBg}">
                    ${isUltimateReady ? '💥 第 6 棒（大招!）' : `🏃 第 ${g.currentRunner}/6 棒`}
                  </span>
                  <div class="flex items-center gap-1">
                    ${Array.from({ length: TEAM_SIZE }, (_, idx) => {
                      const num = idx + 1;
                      const done = num < g.currentRunner;
                      const active = num === g.currentRunner;
                      return `<span class="w-4 h-4 rounded-full text-[10px] font-black flex items-center justify-center ${
                        done ? 'bg-emerald-500 text-slate-950' : active ? 'bg-amber-400 text-slate-950 ring-1 ring-white' : 'bg-slate-800 text-slate-500'
                      }">${num}</span>`;
                    }).join('')}
                  </div>
                </div>

                <!-- 題目區 -->
                <div class="px-2.5 pt-2 pb-2 bg-slate-950/55 border-b border-slate-800">
                  <div class="flex items-center justify-between text-xs mb-1">
                    <span class="text-amber-300 font-bold">${'★'.repeat(g.question.stars)} · ${g.question.category}</span>
                    <span class="text-slate-400">基傷 ${STAR_BASE_DAMAGE[g.question.stars]}</span>
                  </div>
                  <div class="text-base lg:text-lg xl:text-xl font-black text-white leading-snug break-words">
                    ${g.question.text}
                  </div>
                </div>

                <!-- 四個大按鈕選項 -->
                <div class="p-2 flex-1 grid grid-cols-1 gap-1.5 content-stretch">
                  ${g.question.shuffledOptions.map((opt, idx) => {
                    const letter = ['A', 'B', 'C', 'D'][idx];
                    const isEliminated = g.eliminatedOptions.includes(opt);
                    return `
                      <button onclick="handleAnswer(${g.id}, ${opt})" ${isEliminated || isFrozen || state.paused ? 'disabled' : ''}
                        class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-xl border font-black transition cursor-pointer ${
                          isEliminated
                            ? 'bg-slate-900/40 border-slate-800 text-slate-600 line-through cursor-not-allowed'
                            : `bg-slate-800/90 border-slate-600/80 text-white ${g.btnHover} active:scale-[0.98]`
                        }">
                        <span class="text-xs lg:text-sm px-1.5 py-0.5 rounded bg-slate-950/70 text-slate-300 mr-2">${letter}</span>
                        <span class="text-lg lg:text-xl xl:text-2xl flex-1 text-center">${opt}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function render() {
      if (state.isInteracting) return;
        const root = document.getElementById('app');
        root.innerHTML = state.ended ? renderSummary() : renderBattle();
    }

    setInterval(() => {
      if (!state.ended && !state.paused) {
        render();
      }
    }, 500);

    render();
  </script>
</body>
</html>
