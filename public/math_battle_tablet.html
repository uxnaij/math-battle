    const DIVISION_CATEGORIES = new Set([
      '連除基礎', '連除交換', '連除湊積', '三連除',
      '分層裝箱', '烘焙分工', '工廠包裝', '圖書整理'
    ]);

    function getPoolByMode(mode) {
      if (mode === 'division') return QUESTION_BANK.filter(q => DIVISION_CATEGORIES.has(q.category));
      if (mode === 'multistep') return QUESTION_BANK.filter(q => !DIVISION_CATEGORIES.has(q.category));
      return QUESTION_BANK;
    }

    const GROUPS_META = [
      { id: 1, name: '第 1 組', team: '烈焰隊', badgeBg: 'bg-rose-500', border: 'border-rose-500', headerBg: 'from-rose-600 to-rose-800', btnHover: 'hover:border-rose-400 hover:bg-rose-500/20', batonBg: 'bg-rose-500/25 border-rose-400 text-rose-200' },
      { id: 2, name: '第 2 組', team: '疾風隊', badgeBg: 'bg-sky-500', border: 'border-sky-500', headerBg: 'from-sky-600 to-sky-800', btnHover: 'hover:border-sky-400 hover:bg-sky-500/20', batonBg: 'bg-sky-500/25 border-sky-400 text-sky-200' },
      { id: 3, name: '第 3 組', team: '森靈隊', badgeBg: 'bg-emerald-500', border: 'border-emerald-500', headerBg: 'from-emerald-600 to-emerald-800', btnHover: 'hover:border-emerald-400 hover:bg-emerald-500/20', batonBg: 'bg-emerald-500/25 border-emerald-400 text-emerald-200' },
      { id: 4, name: '第 4 組', team: '雷光隊', badgeBg: 'bg-amber-500', border: 'border-amber-500', headerBg: 'from-amber-600 to-amber-800', btnHover: 'hover:border-amber-400 hover:bg-amber-500/20', batonBg: 'bg-amber-500/25 border-amber-400 text-amber-200' },
      { id: 5, name: '第 5 組', team: '幻紫隊', badgeBg: 'bg-violet-500', border: 'border-violet-500', headerBg: 'from-violet-600 to-violet-800', btnHover: 'hover:border-violet-400 hover:bg-violet-500/20', batonBg: 'bg-violet-500/25 border-violet-400 text-violet-200' }
    ];

    const STAR_BASE_DAMAGE = { 1: 120, 2: 240, 3: 380 };
    const ULTIMATE_BONUS_DAMAGE = 1000;

    let audioCtx = null;
    function playTone(type) {
      if (!state.soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        if (type === 'hit') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(560, now + 0.14);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
          osc.start(now); osc.stop(now + 0.16);
        } else if (type === 'ultimate') {
          [330, 440, 554.37, 659.25, 880].forEach((freq, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(freq, now + idx * 0.06);
            g.gain.setValueAtTime(0.14, now + idx * 0.06);
            g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.06 + 0.25);
            o.start(now + idx * 0.06); o.stop(now + idx * 0.06 + 0.25);
          });
        } else if (type === 'wrong') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(170, now);
          osc.frequency.linearRampToValueAtTime(105, now + 0.24);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'win') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, now + idx * 0.11);
            g.gain.setValueAtTime(0.15, now + idx * 0.11);
            g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.11 + 0.24);
            o.start(now + idx * 0.11); o.stop(now + idx * 0.11 + 0.24);
          });
        }
      } catch (e) {}
    }

    function pickQuestion(excludeIds = [], mode = 'mixed') {
      const modePool = getPoolByMode(mode);
      const activeGroupIds = (typeof state !== 'undefined' && state.groups) ? state.groups.map(item => item.question.id) : [];
      const usedIds = (typeof state !== 'undefined' && state.usedQuestionIds) ? state.usedQuestionIds : [];
      const blockedIds = new Set([...excludeIds, ...activeGroupIds, ...usedIds]);

      let pool = modePool.filter(q => !blockedIds.has(q.id));
      if (pool.length === 0 && typeof state !== 'undefined') {
        const modeIdSet = new Set(modePool.map(q => q.id));
        state.usedQuestionIds = (state.usedQuestionIds || []).filter(id => !modeIdSet.has(id));
        const fallbackBlocked = new Set([...excludeIds, ...activeGroupIds]);
        pool = modePool.filter(q => !fallbackBlocked.has(q.id));
      }

      const source = pool.length > 0 ? pool : modePool;
      const wordPool = source.filter(q => q.isWordProblem);
      const numPool = source.filter(q => !q.isWordProblem);
      const pickFrom = (Math.random() < 0.45 && wordPool.length > 0) ? wordPool : (numPool.length > 0 ? numPool : source);
      const q = pickFrom[Math.floor(Math.random() * pickFrom.length)];
      const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
      return { ...q, shuffledOptions, startedAt: Date.now() };
    }

    function initGroups(mode = 'mixed') {
      const used = [];
      return GROUPS_META.map(meta => {
        const q = pickQuestion(used, mode);
        used.push(q.id);
        return {
          ...meta,
          damage: 0,
          combo: 0,
          correctCount: 0,
          wrongCount: 0,
          currentRunner: 1,
          ultimateCount: 0,
          question: q,
          eliminatedOptions: [],
          freezeUntil: 0
        };
      });
    }

    let state = {
      joined: false,
      selectedGroupId: 1,
      myRunnerNo: 1,
      playerLabel: '',
      mode: 'mixed',
      maxHp: 10000,
      hp: 10000,
      started: false,
      paused: false,
      ended: false,
      soundEnabled: true,
      usedQuestionIds: [],
      bannerText: '請點選答案作答，答對幫所屬組別累積輸出傷害！',
      lastFeedback: null,
      ultimateAlert: null,
      errorLogs: [],
      reviewTab: 'byQuestion',
      selectedReviewQId: null,
      showHintInReview: false,
      groups: []
    };
    state.groups = initGroups('mixed');

    let pausedAt = null;
    function setPausedState(nextPaused) {
      if (nextPaused && !state.paused) {
        pausedAt = Date.now();
        state.paused = true;
      } else if (!nextPaused && state.paused) {
        if (pausedAt) {
          const pausedDuration = Date.now() - pausedAt;
          state.groups.forEach(g => {
            g.question.startedAt += pausedDuration;
            if (g.freezeUntil > 0) g.freezeUntil += pausedDuration;
          });
          pausedAt = null;
        }
        state.paused = false;
      }
    }

    function getSpeedMultiplier(startedAt) {
      const elapsedSec = (Date.now() - startedAt) / 1000;
      if (elapsedSec <= 15) return { mult: 1.5, label: '神速 ×1.5', barClass: 'bg-emerald-400', pct: Math.max(15, 100 - (elapsedSec / 30) * 100) };
      if (elapsedSec <= 30) return { mult: 1.2, label: '敏捷 ×1.2', barClass: 'bg-amber-400', pct: Math.max(8, 100 - (elapsedSec / 30) * 100) };
      return { mult: 1.0, label: '穩定 ×1.0', barClass: 'bg-rose-400', pct: 8 };
    }

    function enterTabletBattle(groupId, runnerNo, labelText) {
      const g = state.groups.find(item => item.id === groupId);
      if (g) g.currentRunner = runnerNo;
      state.selectedGroupId = groupId;
      state.playerLabel = (labelText || '').trim();
      state.joined = true;
      state.bannerText = `【${MODE_LABELS[state.mode]}】${g.name}（${g.team}）第 ${g.currentRunner} 棒準備出擊！`;
      render();
    }

    function handleTabletAnswer(chosenValue) {
      if (!state.started || state.paused || state.ended || !state.joined) return;
      const _curG = state.groups.find(item => item.id === state.selectedGroupId);
      if (_curG && (state.myRunnerNo || 1) !== _curG.currentRunner) return;
      const g = state.groups.find(item => item.id === state.selectedGroupId);
      if (!g) return;
      const now = Date.now();
      if (g.freezeUntil > now) return;
      if (g.eliminatedOptions.includes(chosenValue)) return;

      const activeIds = state.groups.map(item => item.question.id);
      const runnerNo = g.currentRunner;
      const tag = state.playerLabel ? `${g.name}（${state.playerLabel}）` : `${g.name}（第 ${runnerNo} 棒）`;

      if (chosenValue === g.question.answer) {
        const { mult } = getSpeedMultiplier(g.question.startedAt);
        const comboBonus = 1 + Math.min(g.combo, 5) * 0.05;
        const baseHit = Math.round(STAR_BASE_DAMAGE[g.question.stars] * mult * comboBonus);
        const completedFullLap = runnerNo >= TEAM_SIZE;
        const bonusDmg = completedFullLap ? ULTIMATE_BONUS_DAMAGE : 0;
        const actualDmg = Math.min(state.hp, baseHit + bonusDmg);

        g.damage += actualDmg;
        g.combo += 1;
        g.correctCount += 1;
        if (!state.usedQuestionIds.includes(g.question.id)) {
          state.usedQuestionIds.push(g.question.id);
        }
        g.eliminatedOptions = [];
        state.hp = Math.max(0, state.hp - actualDmg);

        if (completedFullLap) {
          g.currentRunner = 1;
          g.ultimateCount += 1;
          state.lastFeedback = { ok: true, text: `💥 6 棒接力完成！合體大招造成 ${actualDmg} 點傷害！` };
          state.bannerText = `💥 ${g.name}第 6 棒壓軸命中！發動合體大招 -${actualDmg} 傷！請換第 1 棒！`;
          playTone('ultimate');
          state.ultimateAlert = `🔥 ${g.name}（${g.team}）6 棒接力完成！-${actualDmg} 傷！`;
          setTimeout(() => { state.ultimateAlert = null; render(); }, 1800);
        } else {
          g.currentRunner = runnerNo + 1;
          state.lastFeedback = { ok: true, text: `⚔️ 答對了！幫${g.name}造成 ${actualDmg} 點傷害，交棒第 ${g.currentRunner} 棒！` };
          state.bannerText = `⚔️ ${tag}答對（-${actualDmg} 傷）！交棒給第 ${g.currentRunner} 棒！`;
          playTone('hit');
        }

        if (state.hp <= 0) {
          state.ended = true;
          playTone('win');
          const topErr = getWrongQuestionStats()[0];
          state.selectedReviewQId = topErr ? topErr.question.id : null;
          render();
          return;
        }

        g.question = pickQuestion(activeIds, state.mode);
        render();
      } else {
        g.combo = 0;
        g.wrongCount += 1;
        g.eliminatedOptions.push(chosenValue);
        g.freezeUntil = now + 4000;
        state.lastFeedback = { ok: false, text: `❄️ 誤選「${chosenValue}」，冷卻 4 秒！跟組員討論算式再試一次！` };
        state.bannerText = `❄️ ${tag}誤選「${chosenValue}」，冷卻 4 秒！`;
        playTone('wrong');
        state.errorLogs.push({
          id: now + Math.random(),
          groupId: g.id,
          groupName: tag,
          question: g.question,
          chosenValue,
          correctAnswer: g.question.answer
        });
        render();
      }
    }

    function resetGame(newMaxHp = state.maxHp, newMode = state.mode) {
      pausedAt = null;
      const keepGroupId = state.selectedGroupId;
      const keepRunnerNo = state.myRunnerNo || 1;
      const keepLabel = state.playerLabel;
      const keepJoined = state.joined;
      state = {
        joined: keepJoined,
        selectedGroupId: keepGroupId,
        myRunnerNo: keepRunnerNo,
        playerLabel: keepLabel,
        mode: newMode,
        maxHp: newMaxHp,
        hp: newMaxHp,
        started: false,
      paused: false,
      ended: false,
        soundEnabled: state.soundEnabled,
        usedQuestionIds: [],
        bannerText: `【${MODE_LABELS[newMode]}】新回合開始！請派【第 1 棒】出戰！`,

        ultimateAlert: null,
        errorLogs: [],
        reviewTab: 'byQuestion',
        selectedReviewQId: null,
        showHintInReview: false,
        groups: []
      };
      state.groups = initGroups(newMode);
      render();
    }

    function finishBattleNow() {
      state.ended = true;
      const topErr = getWrongQuestionStats()[0];
      state.selectedReviewQId = topErr ? topErr.question.id : null;
      render();
    }

    function getWrongQuestionStats() {
      const map = new Map();
      for (const log of state.errorLogs) {
        const qid = log.question.id;
        if (!map.has(qid)) map.set(qid, { question: log.question, wrongCount: 0, attempts: [] });
        const entry = map.get(qid);
        entry.wrongCount += 1;
        entry.attempts.push({ groupName: log.groupName, chosenValue: log.chosenValue });
      }
      return Array.from(map.values()).sort((a, b) => b.wrongCount - a.wrongCount);
    }

                <option value="division" ${state.mode === 'division' ? 'selected' : ''}>連除專攻模式</option>

                    <h2 class="text-2xl md:text-3xl font-black text-amber-300 mb-2">等待大屏按下「開始對戰」</h2>
                    <p class="text-slate-300 text-sm md:text-base font-bold mb-6">
                      你已進入房間 <span class="text-white">${ROOM_ID}</span> · <span class="text-amber-200">${g.name}（第 ${state.myRunnerNo || 1} 棒）</span><br/>
                      請先看題暖身，等大屏開始後全員同步作答！
                    </p>
                    <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-amber-500/15 border border-amber-400/40 text-amber-200 text-xs font-black">
                      <span>● 已連線同步中，等待開戰訊號...</span>
                    </div>
                  </div>
                </div>
              ` : '';
              const turnBanner = !isMyTurnRunner ? `
                <div class="mb-4 px-4 py-3 rounded-2xl bg-sky-500/20 border border-sky-400/50 text-sky-200 text-sm font-black text-center">
                  👀 只能看題：你是第 ${state.myRunnerNo || 1} 棒，目前由「第 ${g.currentRunner} 棒」作答
                </div>
              ` : `
                <div class="mb-4 px-4 py-2 rounded-2xl bg-emerald-500/15 border border-emerald-400/40 text-emerald-200 text-xs font-black text-center">
                  ⚔️ 輪到你作答：你是第 ${state.myRunnerNo || 1} 棒（目前第 ${g.currentRunner} 棒）
                </div>
              `;
              return waitingModal + turnBanner;
            })()}
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4">
              ${g.question.shuffledOptions.map((opt, idx) => {
                const letter = ['A', 'B', 'C', 'D'][idx];
                const isEliminated = g.eliminatedOptions.includes(opt);
                return `
                  <button type="button" onclick="handleTabletAnswer(${opt})" ${isOptionDisabled ? 'disabled opacity-45 cursor-not-allowed' : 'cursor-pointer'} class="w-full flex items-center justify-between px-4 py-4 md:py-5 rounded-2xl border-2 font-black transition cursor-pointer ${
                      isEliminated
                        ? 'bg-slate-900/40 border-slate-800 text-slate-600 line-through cursor-not-allowed'
                        : `bg-slate-800/95 border-slate-600 text-white ${g.btnHover} active:scale-[0.98]`
                    }">
                    <span class="text-base md:text-lg px-2.5 py-1 rounded-lg bg-slate-950/80 text-slate-300 mr-3 shrink-0">${letter}</span>
                    <span class="text-3xl sm:text-4xl md:text-5xl flex-1 text-center leading-none">${opt}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

        setInterval(() => {
      if (state.joined && !state.ended && !state.paused) {
        render();
      }
    }, 500);

    render();
    const ROOM_ID = (new URLSearchParams(window.location.search).get('room') || '506').trim() || '506';

    function isTabletControlFocused() {
      const active = document.activeElement;
      if (!active) return false;
      return active.tagName === 'SELECT' || active.tagName === 'INPUT' || active.tagName === 'TEXTAREA';
    }

    function applyServerRoomStateToTablet(data) {
      const lockedJoinedByBattle = Boolean(state.joined);
      if (!data || !Array.isArray(data.teams)) return;
      state.maxHp = Number(data.maxHp ?? state.maxHp ?? 10000);
      state.hp = Number(data.hp ?? state.hp);
      if (typeof setPausedState === 'function') {
        setPausedState(Boolean(data.paused));
      } else {
        state.paused = Boolean(data.paused);
      }
      state.started = Boolean(data.started);
      if (state.started && state.joined && !state.ended && typeof render === 'function') { render(); }
      state.ended = Boolean(data.ended);
      if (lockedJoinedByBattle && !state.ended) { state.joined = true; }
      data.teams.forEach((t, idx) => {
        const g = state.groups[idx];
        if (!g) return;
        g.damage = Number(t.damage ?? g.damage ?? 0);
        g.runnerCount = Number(t.runnerCount ?? g.runnerCount ?? TEAM_SIZE);
        if (g.id !== state.selectedGroupId) {
          g.currentRunner = Number(t.runner ?? g.currentRunner ?? 1);
        }
      });
    }

    async function syncTabletRoom() {
      if (isTabletControlFocused()) return;
      try {
        const res = await fetch('/api/battle-room?room=' + encodeURIComponent(ROOM_ID), {
          cache: 'no-store',
        });
        if (!res.ok) return;
        const data = await res.json();
        applyServerRoomStateToTablet(data);
        if (!isTabletControlFocused()) {
          render();
        }
      } catch (err) {
        console.error('Tablet sync error:', err);
      }
    }

    async function sendTabletHitToServer(groupId, damage, advanceRunner) {
      try {
        const res = await fetch('/api/battle-room', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            room: ROOM_ID,
            action: 'hit',
            teamIndex: groupId - 1,
            damage: damage,
            advanceRunner: Boolean(advanceRunner),
          }),
        });
        if (res.ok) {
          const data = await res.json();
          applyServerRoomStateToTablet(data);
          if (!isTabletControlFocused()) {
            render();
          }
        }
      } catch (err) {
        console.error('Tablet hit sync error:', err);
      }
    }

    if (typeof handleTabletAnswer === 'function') {
      const _origHandleTabletAnswer = handleTabletAnswer;
      window.handleTabletAnswer = function (chosenValue) {
        const g = state.groups.find(item => item.id === state.selectedGroupId);
        const prevDamage = g ? g.damage : 0;
        const prevRunner = g ? g.currentRunner : 1;
        const isCorrect = g && g.question && chosenValue === g.question.answer;

        _origHandleTabletAnswer(chosenValue);

        if (g && isCorrect) {
          const deltaDmg = Math.max(0, g.damage - prevDamage);
          const didAdvance = g.currentRunner !== prevRunner;
          sendTabletHitToServer(g.id, deltaDmg, didAdvance);
        }
      };
    }

    syncTabletRoom();
    setInterval(syncTabletRoom, 2500);
  
    function updateWaitingModal() {
      let overlay = document.getElementById('battle-waiting-overlay');
      const shouldShow = Boolean(typeof state !== 'undefined' && state.joined && !state.ended && !state.started);
      if (!shouldShow) {
        if (overlay) overlay.remove();
        return;
      }
      const curGroup = Array.isArray(state.groups)
        ? (state.groups.find(item => item.id === state.selectedGroupId) || state.groups[0])
        : null;
      const roomText = typeof ROOM_ID !== 'undefined' ? ROOM_ID : '506';
      const runnerText = state.myRunnerNo || 1;
      const groupText = curGroup ? `${curGroup.name}（第 ${runnerText} 棒）` : `第 ${runnerText} 棒`;

      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'battle-waiting-overlay';
        overlay.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(2,6,23,0.92);display:flex;align-items:center;justify-content:center;padding:24px;';
        document.body.appendChild(overlay);
      }
      overlay.innerHTML = `
        <div style="max-width:480px;width:100%;background:#0f172a;border:2px solid rgba(251,191,36,0.7);border-radius:24px;padding:32px;text-align:center;color:#f8fafc;box-shadow:0 25px 50px -12px rgba(0,0,0,0.75);">
          <div style="font-size:48px;margin-bottom:12px;">⏳</div>
          <div style="font-size:24px;font-weight:900;color:#fcd34d;margin-bottom:10px;">等待大屏按下「開始對戰」</div>
          <div style="font-size:15px;font-weight:700;color:#cbd5e1;line-height:1.65;margin-bottom:20px;">
            房間 <span style="color:#ffffff;">${roomText}</span> · <span style="color:#fde68a;">${groupText}</span><br/>
            全班已進入準備區，等大屏開始後全員同步作答！
          </div>
          <div style="display:inline-block;padding:8px 16px;border-radius:999px;background:rgba(245,158,11,0.18);border:1px solid rgba(251,191,36,0.45);color:#fde68a;font-size:13px;font-weight:800;">
            ● 已連線同步中，等待大屏開始...
          </div>
        </div>
      `;
    }

    setInterval(updateWaitingModal, 300);
  </script>
</body>
</html>
