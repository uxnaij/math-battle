    ];
    const fallbackQuestions = [
      { id: "q1", category: "整數四則", text: "一箱蘋果有 24 顆，賣出 9 顆後，剩下的平分給 3 位同學，每人分到幾顆？", options: [4, 5, 6, 8], answer: 5, stars: 1, baseScore: 100 },

    ];

    const state = {
      joined: false,
      started: false,
      paused: false,
      ended: false,
      submittingAnswer: false,
      selectedGroupId: 1,
      playerLabel: "",
      maxHp: 10000,
      hp: 10000,
      feedbackMsg: "",
      feedbackOk: null,
      groups: defaultGroups.map(g => Object.assign({}, g, { eliminatedOptions: [], wrongAnswers: [] }))
    };

    function pickNextQuestion(grp) {
      const pool = Array.isArray(window.BATTLE_QUESTIONS) && window.BATTLE_QUESTIONS.length ? window.BATTLE_QUESTIONS : fallbackQuestions;
      const curId = grp && grp.question ? grp.question.id : null;
      const candidates = pool.filter(q => q.id !== curId);
      const list = candidates.length ? candidates : pool;
      const q = list[Math.floor(Math.random() * list.length)];
      return Object.assign({}, q, { startedAt: Date.now() });
    }

    function ensureGroupQuestions() {
      state.groups.forEach(g => {
        if (!g.question || !g.question.text) {
          g.question = pickNextQuestion(g);
        }
      });
    }

    function guardTabletJoinedState() {
      try {
        if (state.joined) {
          const exists = Array.isArray(state.groups) && state.groups.some(g => g.id === state.selectedGroupId);
          if (!exists) {
            state.selectedGroupId = (state.groups && state.groups[0]) ? state.groups[0].id : 1;
          }
        }
      } catch (_) {}
    }

    function selectGroup(id) {
      state.selectedGroupId = Number(id) || 1;
      render();
    }

    function joinBattle() {
      const inp = document.getElementById("playerLabelInput");
      state.playerLabel = inp ? String(inp.value || "").trim() : state.playerLabel;
      if (!state.selectedGroupId) state.selectedGroupId = 1;
      state.joined = true;
      state.feedbackMsg = "";
      state.feedbackOk = null;
      ensureGroupQuestions();
      render();
      syncTabletRoom();
    }

    function backToJoin() {
      state.joined = false;
      state.submittingAnswer = false;
      render();
    }

    function resetTabletBattle() {
      state.ended = false;
      state.submittingAnswer = false;
      state.feedbackMsg = "";
      state.feedbackOk = null;
      state.hp = state.maxHp || 10000;
      state.groups.forEach(g => {
        g.damage = 0;
        g.correctCount = 0;
        g.combo = 0;
        g.currentRunner = 1;
        g.eliminatedOptions = [];
        g.question = pickNextQuestion(g);
      });
    }

    function finishBattleNow() {
      state.ended = true;
      render();
    }

    function advanceRunnerOnCorrect(grp) {
      if (!grp) return;
      const maxR = Math.max(1, Number(grp.runnerCount || 6));
      const cur = Math.max(1, Number(grp.currentRunner || 1));
      grp.currentRunner = (cur % maxR) + 1;
    }

    async function syncGroupQuestionToServer(grp) {
      if (!grp || !grp.question) return Promise.resolve();
      const payloadQuestion = Object.assign({}, grp.question, {
        runner: grp.currentRunner || 1
      });
      return fetch("/api/battle-room", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          room: ROOM_ID,
          action: "syncQuestion",
          teamIndex: grp.id - 1,
          question: payloadQuestion,
          eliminatedOptions: grp.eliminatedOptions || [],
          combo: Number(grp.combo || 0)
        })
      }).catch(() => {});
    }

    async function sendTabletHitToServer(groupId, damage, correctCount, advanceRunner, grpSnapshot) {
      try {
        const grp = state.groups.find(item => item.id === groupId) || grpSnapshot;
        const res = await fetch("/api/battle-room", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            room: ROOM_ID,
            action: "hit",
            teamIndex: groupId - 1,
            damage: Number(damage || 0),
            correctCount: Number(correctCount || 0), correctCountInc: 1,
            advanceRunner: Boolean(advanceRunner),
            runnerCount: 6,
            combo: grp ? Number(grp.combo || 0) : 0,
            question: grp ? grp.question : null,
            eliminatedOptions: grp ? (grp.eliminatedOptions || []) : [], wrongAnswers: grp ? (grp.wrongAnswers || []) : []
          })
        });
        if (res.ok) {
          const data = await res.json();
          const localQ = grp ? grp.question : null;
          state.submittingAnswer = false;
          applyServerRoomStateToTablet(data);
          if (grp && localQ && (!data.teams || !data.teams[groupId - 1] || !data.teams[groupId - 1].question)) {
            grp.question = localQ;
            await syncGroupQuestionToServer(grp);
          }
          if (state.joined && !isTabletControlFocused()) {
            render();
          }
        } else {
          state.submittingAnswer = false;
        }
      } catch (err) {
        state.submittingAnswer = false;
        console.error("Tablet hit sync error:", err);
      }
    }

    function recordTabletWrongAnswer(grp, chosenVal) { if (!grp || !grp.question) return; if (!Array.isArray(grp.wrongAnswers)) grp.wrongAnswers = []; grp.wrongAnswers.push({ id: grp.question.id || '', category: grp.question.category || '', text: grp.question.text || '', chosen: chosenVal, answer: grp.question.answer, hint: grp.question.hint || '', at: Date.now() }); fetch('/api/battle-room', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ room: ROOM_ID, action: 'syncQuestion', teamIndex: grp.id - 1, question: grp.question, eliminatedOptions: grp.eliminatedOptions || [], combo: Number(grp.combo || 0), wrongAnswers: grp.wrongAnswers }) }).catch(() => {}); }
    function handleTabletAnswer(chosenValue) {
      if (!state.started || state.paused || state.ended || !state.joined || state.submittingAnswer) return;
      const g = state.groups.find(item => item.id === state.selectedGroupId);
      if (!g || !g.question) return;

      // 點擊當下立刻鎖定，避免連點或延遲感
      state.submittingAnswer = true;
      render();

      const isCorrect = String(chosenValue) === String(g.question.answer);
      const prevRunner = Number(g.currentRunner || 1);

      if (isCorrect) {
        g.combo = Number(g.combo || 0) + 1;
        g.correctCount = Number(g.correctCount || 0) + 1;
        const stars = Number(g.question.stars || 1);
        const baseScore = Number(g.question.baseScore || stars * 100);
        const mult = 1 + Math.min(g.combo - 1, 5) * 0.1;
        const dmg = Math.round(baseScore * mult);
        g.damage = Number(g.damage || 0) + dmg;
        state.hp = Math.max(0, Number(state.hp || state.maxHp || 10000) - dmg);
        advanceRunnerOnCorrect(g);
        g.eliminatedOptions = [];
        g.question = pickNextQuestion(g);
        state.feedbackOk = true;
        state.feedbackMsg = `答對了！+${dmg} 分，交棒給第 ${g.currentRunner} 棒`;
        sendTabletHitToServer(g.id, dmg, g.correctCount, g.currentRunner !== prevRunner, g);
      } else {
        g.combo = 0;
        if (!Array.isArray(g.eliminatedOptions)) g.eliminatedOptions = [];
        if (!g.eliminatedOptions.includes(chosenValue)) {
          g.eliminatedOptions.push(chosenValue);
        recordTabletWrongAnswer(g, chosenValue);
        }
        state.feedbackOk = false;
        state.feedbackMsg = `再算一次！維持第 ${prevRunner} 棒作答（答對一題換一棒）`;
        state.submittingAnswer = false;
        render();
      }
    }

    function applyServerRoomStateToTablet(data) {
      const keepJoined = Boolean(state.joined);
      if (!data || !Array.isArray(data.teams)) return;
      state.maxHp = Number(data.maxHp ?? state.maxHp ?? 10000);
      state.hp = Number(data.hp ?? state.hp);
      state.paused = Boolean(data.paused);
      state.started = Boolean(data.started);
      state.ended = Boolean(data.ended);
      if (keepJoined) {
        state.joined = true;
      }
      data.teams.forEach((t, idx) => {
        const g = state.groups[idx];
        if (!g) return;
        const prevDmg = Number(g.damage || 0); g.damage = Number(t.damage ?? 0); if (prevDmg > 0 && g.damage === 0) { g.combo = 0; g.eliminatedOptions = []; g.wrongAnswers = []; state.feedbackMsg = ""; state.feedbackOk = null; }
        if (t.correctCount !== undefined && t.correctCount !== null) {
          g.correctCount = Number(t.correctCount ?? 0);
        }
        if (t.combo !== undefined && t.combo !== null) {
          g.combo = Number(t.combo || 0);
        }
        g.runnerCount = 6;
        const serverRunner = Number(t.runner ?? 0);
        if (serverRunner >= 1 && serverRunner <= 6) {
          g.currentRunner = serverRunner;
        }
        if (Array.isArray(t.wrongAnswers)) { g.wrongAnswers = t.wrongAnswers; }
        if (t.question && typeof t.question === "object" && t.question.text) {
          const sameQ = g.question && g.question.id === t.question.id && g.question.text === t.question.text;
          g.question = Object.assign({}, t.question, {
            startedAt: sameQ && g.question.startedAt ? g.question.startedAt : (t.question.startedAt || Date.now())
          });
          g.eliminatedOptions = Array.isArray(t.eliminatedOptions) ? t.eliminatedOptions : [];
        }
      });
      ensureGroupQuestions();
    }

    async function syncTabletRoom() {
      try {
        const res = await fetch("/api/battle-room?room=" + encodeURIComponent(ROOM_ID), { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        state.submittingAnswer = false;
        applyServerRoomStateToTablet(data);
        if (state.joined && !isTabletControlFocused()) {
          render();
        }
      } catch (err) {
        console.error("Tablet sync error:", err);
      }
    }

    function isTabletControlFocused() {
      const active = document.activeElement;
      if (!active) return false;
      return active.tagName === "SELECT" || active.tagName === "INPUT" || active.tagName === "TEXTAREA";
    }

    function renderJoinScreen() {
      const groupButtons = state.groups.map(g => {
        const active = g.id === state.selectedGroupId;
        return `
          <button type="button" onclick="selectGroup(${g.id})"
            class="p-4 rounded-2xl border-2 text-left transition cursor-pointer ${active ? "bg-indigo-600/30 border-indigo-400 shadow-lg" : "bg-slate-800/80 border-slate-700 hover:border-slate-500"}">
            <div class="flex items-center justify-between mb-1">
              <span class="font-black text-lg text-white">${g.name}</span>
              <span class="text-xs px-2.5 py-0.5 rounded-full ${active ? "bg-indigo-400 text-slate-950 font-black" : "bg-slate-700 text-slate-300"}">${active ? "已選組別" : "點此選擇"}</span>
            </div>
            <div class="text-xs text-slate-300">${g.team} · 目前第 ${g.currentRunner || 1} 棒</div>
          </button>
        `;
      }).join("");

      return `
        <div class="max-w-3xl w-full m-auto bg-slate-900/95 border border-slate-700/80 rounded-3xl p-6 md:p-8 shadow-2xl">
          <div class="text-xs font-black tracking-widest text-indigo-400 uppercase mb-1">ROOM ${ROOM_ID} · SINGLE TABLET RELAY</div>
          <h1 class="text-2xl md:text-3xl font-black text-white mb-2">📱 平板組別版：選擇你的組別</h1>
          <p class="text-slate-300 text-sm mb-6">
            一組一台平板，<strong>答對一題換一棒</strong>（不需手動選棒次）。選定組別後按下「進入挑戰」，等大屏開始即可作答。
          </p>

          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-6">
            ${groupButtons}
          </div>

          <div class="mb-6">
            <label class="block text-xs font-black text-slate-300 mb-2">小隊暱稱／備註（選填）</label>
            <input id="playerLabelInput" type="text" value="${state.playerLabel || ""}" placeholder="例如：五己第一組平板"
              class="w-full px-4 py-3 rounded-2xl bg-slate-800 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-400" />
          </div>

          <button type="button" onclick="joinBattle()"
            class="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-500 via-sky-500 to-emerald-500 hover:opacity-95 text-slate-950 font-black text-lg shadow-xl transition cursor-pointer">
            🚀 進入挑戰
          </button>
        </div>
      `;
    }

    function renderTabletBattle() {
      try {
        ensureGroupQuestions();
        const g = (Array.isArray(state.groups) ? (state.groups.find(item => item.id === state.selectedGroupId) || state.groups[0]) : null);
        if (!g) {
          return `<div class="max-w-xl w-full m-auto bg-slate-900 border border-slate-700 p-6 rounded-2xl text-center">找不到組別資料</div>`;
        }

        const curRunner = Math.max(1, Number(g.currentRunner || 1));
        const teamCombo = Number(g.combo || 0);
        const comboMult = 1 + Math.min(teamCombo, 5) * 0.1;
        const stars = Number((g.question && g.question.stars) || 1);
        const baseScore = Number((g.question && g.question.baseScore) || stars * 100);
        const estimatedDmg = Math.round(baseScore * comboMult);
        const canAnswerNow = Boolean(state.started && !state.paused && !state.ended && !state.submittingAnswer);

        const startedAt = g.question && g.question.startedAt ? Number(g.question.startedAt) : Date.now();
        const elapsedSec = Math.max(0, (Date.now() - startedAt) / 1000);
        const speedBarPct = canAnswerNow ? Math.max(10, Math.min(100, Math.round((1 - Math.min(elapsedSec, 20) / 20) * 100))) : 100;

        let statusBanner = "";
        if (!state.started) {
          statusBanner = `<div class="mb-4 px-4 py-3 rounded-2xl bg-amber-500/15 border border-amber-400/40 text-amber-200 text-sm font-black text-center">⏳ 等待大屏開始對戰中（目前第 ${curRunner} 棒 · 答對一題換一棒）</div>`;
        } else if (state.paused) {
          statusBanner = `<div class="mb-4 px-4 py-3 rounded-2xl bg-slate-700/60 border border-slate-500 text-slate-200 text-sm font-black text-center">⏸️ 對戰暫停中（目前第 ${curRunner} 棒）</div>`;
        } else if (state.submittingAnswer) {
          statusBanner = `<div class="mb-4 px-4 py-3 rounded-2xl bg-sky-500/20 border border-sky-400/50 text-sky-200 text-sm font-black text-center">🔒 作答送出中，請稍候...</div>`;
        } else {
          statusBanner = `<div class="mb-4 px-4 py-2.5 rounded-2xl bg-emerald-500/15 border border-emerald-400/40 text-emerald-200 text-sm font-black text-center">⚔️ 目前由「第 ${curRunner} 棒」作答 · 答對一題換一棒</div>`;
        }

        const feedbackBanner = state.feedbackMsg
          ? `<div class="mb-4 px-4 py-2.5 rounded-2xl border text-sm font-black text-center ${state.feedbackOk ? "bg-emerald-500/20 border-emerald-400/50 text-emerald-200" : "bg-rose-500/20 border-rose-400/50 text-rose-200"}">${state.feedbackMsg}</div>`
          : "";

        const eliminatedList = Array.isArray(g.eliminatedOptions) ? g.eliminatedOptions : [];
        const optionsList = (g.question && Array.isArray(g.question.options) && g.question.options.length)
          ? g.question.options
          : ["A", "B", "C", "D"];

        const optionsHtml = optionsList.map((opt, idx) => {
          const letter = ["A", "B", "C", "D"][idx] || String(idx + 1);
          const isEliminated = eliminatedList.some(item => String(item) === String(opt));
          const isOptionDisabled = Boolean(!canAnswerNow || isEliminated);
          const btnClass = isOptionDisabled
            ? "bg-slate-900/60 border-slate-800 text-slate-500 opacity-50 cursor-not-allowed"
            : `bg-slate-800/95 border-slate-600 text-white ${g.btnHover || "hover:border-amber-400"} active:scale-[0.98] cursor-pointer`;
          const safeArg = typeof opt === "number" ? String(opt) : JSON.stringify(String(opt));
          return `
            <button type="button" onclick="handleTabletAnswer(${safeArg.replace(/"/g, "&quot;")})" ${isOptionDisabled ? "disabled" : ""}
              class="w-full flex items-center justify-between px-4 py-4 md:py-5 rounded-2xl border-2 font-black transition ${btnClass}">
              <span class="text-base md:text-lg px-2.5 py-1 rounded-lg bg-slate-950/80 text-slate-300 mr-3 shrink-0">${letter}</span>
              <span class="text-2xl sm:text-3xl md:text-4xl flex-1 text-center leading-tight break-all">${opt}</span>
            </button>
          `;
        }).join("");

        const qCategory = (g.question && g.question.category) ? g.question.category : "計算題";
        const qText = (g.question && g.question.text) ? g.question.text : "等待題目載入中...";
        const playerPrefix = state.playerLabel ? `${state.playerLabel} · ` : "";
        const starIcons = "★".repeat(Math.max(1, Math.min(5, stars)));

        return `
          <div class="max-w-4xl w-full mx-auto flex-1 flex flex-col justify-between gap-4">
            <div class="bg-slate-900/95 border-2 ${g.border || "border-slate-700"} rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 shadow-xl">
              <div class="flex items-center gap-3">
                <span class="px-3 py-1.5 rounded-xl ${g.badgeBg || "bg-indigo-600"} text-white font-black text-base md:text-lg">${g.name} · ${g.team}</span>
                <div>
                  <div class="text-xs text-slate-300 font-bold">${playerPrefix}目前第 ${curRunner} 棒（答對一題換一棒）</div>
                  <div class="text-xl md:text-2xl font-black text-rose-400">⚔️ 本組輸出：${Number(g.damage || 0).toLocaleString()} 點</div>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <button type="button" onclick="backToJoin()"
                  class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 text-xs md:text-sm font-black cursor-pointer">
                  換組別
                </button>
                <button type="button" onclick="finishBattleNow()"
                  class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs md:text-sm font-black cursor-pointer">
                  📊 結算戰績
                </button>
              </div>
            </div>

            <div class="bg-slate-900/95 border border-slate-700/80 rounded-3xl p-5 md:p-7 flex-1 flex flex-col justify-between shadow-2xl">
              <div class="mb-5">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                  <span class="text-xs font-black text-amber-300 uppercase tracking-wider">${qCategory}</span>
                  <div class="flex items-center gap-2">
                    <span class="px-2.5 py-1 rounded-lg bg-amber-500/20 border border-amber-400/40 text-amber-200 text-xs font-black">難度 ${starIcons}（${stars} 星）</span>
                    <span class="px-2.5 py-1 rounded-lg bg-rose-500/20 border border-rose-400/40 text-rose-200 text-xs font-black">基礎 ${baseScore} 分</span>
                  </div>
                </div>
                <div class="text-2xl sm:text-3xl md:text-4xl font-black text-white leading-relaxed break-words">${qText}</div>
              </div>

              <div class="mb-4 space-y-2.5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  <div class="px-3.5 py-2.5 rounded-2xl bg-amber-500/15 border border-amber-400/40 flex items-center justify-between">
                    <span class="text-xs font-black text-amber-200">🔥 團隊連擊</span>
                    <span class="text-sm font-black text-amber-300">${teamCombo} 連擊（×${comboMult.toFixed(2)}）</span>
                  </div>
                  <div class="px-3.5 py-2.5 rounded-2xl bg-emerald-500/15 border border-emerald-400/40 flex items-center justify-between">
                    <span class="text-xs font-black text-emerald-200">🎯 預估本題得分</span>
                    <span class="text-sm font-black text-emerald-300">約 ${estimatedDmg.toLocaleString()} 分</span>
                  </div>
                </div>
                <div class="w-full h-2 bg-slate-950 rounded-full overflow-hidden border border-slate-700/80">
                  <div style="width: ${speedBarPct}%" class="h-full bg-gradient-to-r from-cyan-400 via-sky-400 to-emerald-400 transition-all duration-300"></div>
                </div>
              </div>

              ${feedbackBanner}
              ${statusBanner}

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4">
                ${optionsHtml}
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        console.error("renderTabletBattle error:", err);
        return `<div class="max-w-xl w-full m-auto bg-slate-900 border border-rose-500/50 text-rose-200 p-6 rounded-2xl font-bold">畫面渲染錯誤：${String(err && err.message ? err.message : err)}</div>`;
      }
    }

    function renderSummary() {
      const sorted = [...state.groups].sort((a, b) => (b.damage || 0) - (a.damage || 0));
      const champion = sorted[0] || state.groups[0];
      const totalDmg = state.groups.reduce((acc, item) => acc + (item.damage || 0), 0);
      return `
        <div class="max-w-3xl w-full m-auto bg-slate-900/95 border border-amber-400/50 rounded-3xl p-6 md:p-8 shadow-2xl text-white">
          <div class="text-xs font-black tracking-widest text-amber-300 uppercase mb-1">BATTLE SUMMARY</div>
          <h1 class="text-2xl md:text-3xl font-black mb-2">🏆 對戰結算</h1>
          <p class="text-sm text-slate-300 mb-6">
            最高輸出隊伍：<span class="text-amber-300 font-black">${champion ? `${champion.name}（${champion.team}）` : "無"}</span> · 總傷害：<span class="text-emerald-300 font-black">${totalDmg.toLocaleString()}</span> 點
          </p>
          <div class="space-y-2.5 mb-6">
            ${sorted.map((grp, idx) => `
              <div class="flex items-center justify-between px-4 py-3 rounded-2xl border ${idx === 0 ? "bg-amber-500/15 border-amber-400/60" : "bg-slate-800/80 border-slate-700"}">
                <div class="font-black">
                  <span class="text-amber-300 mr-2">#${idx + 1}</span>
                  <span>${grp.name}（${grp.team}）</span>
                </div>
                <div class="text-right">
                  <span class="font-black text-emerald-300">${(grp.damage || 0).toLocaleString()} 點</span>
                  
                </div>
              </div>
            `).join("")}
          </div>
          <div class="flex flex-wrap gap-3">
            <button type="button" onclick="state.ended = false; render();"
              class="flex-1 py-3.5 px-5 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-slate-600 font-black transition cursor-pointer">
              查看對戰畫面
            </button>
            <button type="button" onclick="resetTabletBattle(); render();"
              class="flex-1 py-3.5 px-5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black transition cursor-pointer">
              重新準備挑戰
            </button>
          </div>
        </div>
      `;
    }

    function render() {
      guardTabletJoinedState();
      const root = document.getElementById("app");
      if (!root) return;
      if (state.ended) {
        root.innerHTML = renderSummary();
      } else if (!state.joined) {
        root.innerHTML = renderJoinScreen();
      } else {
        root.innerHTML = renderTabletBattle();
      }
    }

    let lastRenderSig = "";
    function renderIfChanged() {
      const g = state.groups.find(item => item.id === state.selectedGroupId) || state.groups[0];
      const sig = [
        state.joined ? 1 : 0,
        state.started ? 1 : 0,
        state.paused ? 1 : 0,
        state.ended ? 1 : 0,
        state.submittingAnswer ? 1 : 0,
        state.hp,
        g ? g.currentRunner : 0,
        g ? g.damage : 0,
        g ? g.correctCount : 0,
        g ? (g.combo || 0) : 0,
        g && g.question ? (g.question.id || g.question.text) : "",
        (g && g.eliminatedOptions) ? g.eliminatedOptions.join(",") : ""
      ].join("|");
      if (sig !== lastRenderSig) {
        lastRenderSig = sig;
        render();
      }
    }

    setInterval(() => {
      if (state.joined && !state.ended && !state.paused && !isTabletControlFocused()) {
        renderIfChanged();
      }
    }, 800);

    render();
    syncTabletRoom();
    setInterval(syncTabletRoom, 1500);
  </script>
</body>
</html>
