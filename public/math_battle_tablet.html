    const DIVISION_CATEGORIES = new Set([
      '連除基礎', '連除交換', '連除湊積', '三連除',
      '分層裝箱', '烘焙分工', '工廠包裝', '圖書整理'
    ]);

    function getPoolByMode(mode) {
      if (mode === 'division') return QUESTION_BANK.filter(q => DIVISION_CATEGORIES.has(q.category));
      if (mode === 'multistep') return QUESTION_BANK.filter(q => !DIVISION_CATEGORIES.has(q.category));
      return QUESTION_BANK;
    }

    const GROUPS_META = [
      { id: 1, name: '第 1 組', team: '烈焰隊', badgeBg: 'bg-rose-500', border: 'border-rose-500', headerBg: 'from-rose-600 to-rose-800', btnHover: 'hover:border-rose-400 hover:bg-rose-500/20', batonBg: 'bg-rose-500/25 border-rose-400 text-rose-200' },
      { id: 2, name: '第 2 組', team: '疾風隊', badgeBg: 'bg-sky-500', border: 'border-sky-500', headerBg: 'from-sky-600 to-sky-800', btnHover: 'hover:border-sky-400 hover:bg-sky-500/20', batonBg: 'bg-sky-500/25 border-sky-400 text-sky-200' },
      { id: 3, name: '第 3 組', team: '森靈隊', badgeBg: 'bg-emerald-500', border: 'border-emerald-500', headerBg: 'from-emerald-600 to-emerald-800', btnHover: 'hover:border-emerald-400 hover:bg-emerald-500/20', batonBg: 'bg-emerald-500/25 border-emerald-400 text-emerald-200' },

      { id: 5, name: '第 5 組', team: '幻紫隊', badgeBg: 'bg-violet-500', border: 'border-violet-500', headerBg: 'from-violet-600 to-violet-800', btnHover: 'hover:border-violet-400 hover:bg-violet-500/20', batonBg: 'bg-violet-500/25 border-violet-400 text-violet-200' }
    ];

    const STAR_BASE_DAMAGE = { 1: 120, 2: 240, 3: 380 };
    const 0 = 1000;

    let audioCtx = null;
    function playTone(type) {
      if (!state.soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        if (type === 'hit') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(560, now + 0.14);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
          osc.start(now); osc.stop(now + 0.16);
        } else if (type === 'ultimate') {
          [330, 440, 554.37, 659.25, 880].forEach((freq, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(freq, now + idx * 0.06);
            g.gain.setValueAtTime(0.14, now + idx * 0.06);
            g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.06 + 0.25);
            o.start(now + idx * 0.06); o.stop(now + idx * 0.06 + 0.25);
          });
        } else if (type === 'wrong') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(170, now);
          osc.frequency.linearRampToValueAtTime(105, now + 0.24);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'win') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, now + idx * 0.11);
            g.gain.setValueAtTime(0.15, now + idx * 0.11);
            g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.11 + 0.24);
            o.start(now + idx * 0.11); o.stop(now + idx * 0.11 + 0.24);
          });
        }
      } catch (e) {}
    }

    function pickQuestion(excludeIds = [], mode = 'mixed') {
      const modePool = getPoolByMode(mode);
      const activeGroupIds = (typeof state !== 'undefined' && state.groups) ? state.groups.map(item => item.question.id) : [];
      const usedIds = (typeof state !== 'undefined' && state.usedQuestionIds) ? state.usedQuestionIds : [];
      const blockedIds = new Set([...excludeIds, ...activeGroupIds, ...usedIds]);

      let pool = modePool.filter(q => !blockedIds.has(q.id));
      if (pool.length === 0 && typeof state !== 'undefined') {
        const modeIdSet = new Set(modePool.map(q => q.id));
        state.usedQuestionIds = (state.usedQuestionIds || []).filter(id => !modeIdSet.has(id));
        const fallbackBlocked = new Set([...excludeIds, ...activeGroupIds]);
        pool = modePool.filter(q => !fallbackBlocked.has(q.id));
      }

      const source = pool.length > 0 ? pool : modePool;
      const wordPool = source.filter(q => q.isWordProblem);
      const numPool = source.filter(q => !q.isWordProblem);
      const pickFrom = (Math.random() < 0.45 && wordPool.length > 0) ? wordPool : (numPool.length > 0 ? numPool : source);
      const q = pickFrom[Math.floor(Math.random() * pickFrom.length)];
      const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
      return { ...q, shuffledOptions, startedAt: Date.now() };
    }

    function initGroups(mode = 'mixed') {
      const used = [];
      return GROUPS_META.map(meta => {
        const q = pickQuestion(used, mode);
        used.push(q.id);
        return {
          ...meta,
          damage: 0,
          combo: 0,
          correctCount: 0,
          wrongCount: 0,
          currentRunner: 1,
          ultimateCount: 0,
          question: q,
          eliminatedOptions: [],
          freezeUntil: 0
        };
      });
    }

    let state = {
      joined: false,
      selectedGroupId: 1,
      myRunnerNo: 1,
      playerLabel: '',
      mode: 'mixed',
      maxHp: 10000,
      hp: 10000,
      started: false,
      teamRunnerCount: 6,
      paused: false,
      ended: false,
      soundEnabled: true,
      usedQuestionIds: [],
      bannerText: '請點選答案作答，答對幫所屬組別累積輸出傷害！',
      lastFeedback: null,
      ultimateAlert: null,
      errorLogs: [],
      reviewTab: 'byQuestion',
      selectedReviewQId: null,
      showHintInReview: false,
      groups: []
    };
    state.groups = initGroups('mixed');

    let pausedAt = null;
    function setPausedState(nextPaused) {
      if (nextPaused && !state.paused) {
        pausedAt = Date.now();
        state.paused = true;
      } else if (!nextPaused && state.paused) {
        if (pausedAt) {
          const pausedDuration = Date.now() - pausedAt;
          state.groups.forEach(g => {
            g.question.startedAt += pausedDuration;
            if (g.freezeUntil > 0) g.freezeUntil += pausedDuration;
          });
          pausedAt = null;
        }
        state.paused = false;
      }
    }

    function getSpeedMultiplier(startedAt) {
      const elapsedSec = (Date.now() - startedAt) / 1000;
      if (elapsedSec <= 15) return { mult: 1.5, label: '神速 ×1.5', barClass: 'bg-emerald-400', pct: Math.max(15, 100 - (elapsedSec / 30) * 100) };
      if (elapsedSec <= 30) return { mult: 1.2, label: '敏捷 ×1.2', barClass: 'bg-amber-400', pct: Math.max(8, 100 - (elapsedSec / 30) * 100) };
      return { mult: 1.0, label: '穩定 ×1.0', barClass: 'bg-rose-400', pct: 8 };
    }

    function enterTabletBattle(groupId, runnerNo, labelText) {
      const g = state.groups.find(item => item.id === groupId);
      const pickedRunner = Math.min(6, Math.max(1, Number(runnerNo || state.myRunnerNo || 1)));
      state.myRunnerNo = pickedRunner;
      if (g) {
        g.runnerCount = 6;
        if (!g.currentRunner || g.currentRunner < 1 || g.currentRunner > 6) {
          g.currentRunner = 1;
        }
      }
      state.selectedGroupId = groupId;
      state.playerLabel = (labelText || '').trim();
      state.joined = true;
      state.bannerText = `【${MODE_LABELS[state.mode]}】${g.name}（${g.team}）第 ${g.currentRunner} 棒準備出擊！`;
      render();
    }

    function handleTabletAnswer(chosenValue) {
      if (!state.started || state.paused || state.ended || !state.joined) return;
      const _curG = state.groups.find(item => item.id === state.selectedGroupId);
      if (_curG && (state.myRunnerNo || 1) !== _curG.currentRunner) return;
      const g = state.groups.find(item => item.id === state.selectedGroupId);
      if (!g) return;
      const now = Date.now();
      if (g.freezeUntil > now) return;
      if (g.eliminatedOptions.includes(chosenValue)) return;

      const activeIds = state.groups.map(item => item.question.id);
      const runnerNo = g.currentRunner;
      const tag = state.playerLabel ? `${g.name}（${state.playerLabel}）` : `${g.name}（第 ${runnerNo} 棒）`;

      if (chosenValue === g.question.answer) {
        const { mult } = getSpeedMultiplier(g.question.startedAt);
        const comboBonus = 1 + Math.min(g.combo, 5) * 0.05;
        const baseHit = Math.round(STAR_BASE_DAMAGE[g.question.stars] * mult * comboBonus);
        const actualDmg = Math.min(state.hp, baseHit);

        g.damage += actualDmg;
        g.combo += 1;
        g.correctCount += 1;
        if (!state.usedQuestionIds.includes(g.question.id)) {
          state.usedQuestionIds.push(g.question.id);
        }
        g.eliminatedOptions = [];
        state.hp = Math.max(0, state.hp - actualDmg);

        if (false) {
        } else {
          g.currentRunner = runnerNo + 1;
          state.lastFeedback = { ok: true, text: `⚔️ 答對了！幫${g.name}造成 ${actualDmg} 點傷害，交棒第 ${g.currentRunner} 棒！` };
          state.bannerText = `⚔️ ${tag}答對（-${actualDmg} 傷）！交棒給第 ${g.currentRunner} 棒！`;
          playTone('hit');
        }

        if (state.hp <= 0) {
          state.ended = true;
          playTone('win');
          const topErr = getWrongQuestionStats()[0];
          state.selectedReviewQId = topErr ? topErr.question.id : null;
          render();
          return;
        }

        g.question = pickQuestion(activeIds, state.mode);
        if (g && g.question) { g.question.runner = g.currentRunner || 1; syncGroupQuestionToServer(g); }
        if (g && g.question) { g.question.runner = g.currentRunner || 1; syncGroupQuestionToServer(g); }
        syncGroupQuestionToServer(g);
        render();
      } else {
        g.combo = 0;
        g.wrongCount += 1;
        g.eliminatedOptions.push(chosenValue);
        g.freezeUntil = now + 4000;
        state.lastFeedback = { ok: false, text: `❄️ 誤選「${chosenValue}」，冷卻 4 秒！跟組員討論算式再試一次！` };
        state.bannerText = `❄️ ${tag}誤選「${chosenValue}」，冷卻 4 秒！`;
        playTone('wrong');
        state.errorLogs.push({
          id: now + Math.random(),
          groupId: g.id,
          groupName: tag,
          question: g.question,
          chosenValue,
          correctAnswer: g.question.answer
        });
        render();
      }
    }

    function resetGame(newMaxHp = state.maxHp, newMode = state.mode) {
      pausedAt = null;
      const keepGroupId = state.selectedGroupId;
      const keepRunnerNo = state.myRunnerNo || 1;
      const keepLabel = state.playerLabel;
      const keepJoined = state.joined;
      state = {
        joined: keepJoined,
        selectedGroupId: keepGroupId,
        myRunnerNo: keepRunnerNo,
        playerLabel: keepLabel,
        mode: newMode,
        maxHp: newMaxHp,
        hp: newMaxHp,
        started: false,
      teamRunnerCount: 6,
      paused: false,
      ended: false,
        soundEnabled: state.soundEnabled,
        usedQuestionIds: [],
        bannerText: `【${MODE_LABELS[newMode]}】新回合開始！請派【第 1 棒】出戰！`,
        lastFeedback: null,
        ultimateAlert: null,
        errorLogs: [],
        reviewTab: 'byQuestion',
        selectedReviewQId: null,
        showHintInReview: false,
        groups: []
      };
      state.groups = initGroups(newMode);
      render();
    }

    function finishBattleNow() {
      state.ended = true;
      const topErr = getWrongQuestionStats()[0];
      state.selectedReviewQId = topErr ? topErr.question.id : null;
      render();
    }

    function getWrongQuestionStats() {
      const map = new Map();
      for (const log of state.errorLogs) {
        const qid = log.question.id;
        if (!map.has(qid)) map.set(qid, { question: log.question, wrongCount: 0, attempts: [] });
        const entry = map.get(qid);
        entry.wrongCount += 1;
        entry.attempts.push({ groupName: log.groupName, chosenValue: log.chosenValue });
      }
      return Array.from(map.values()).sort((a, b) => b.wrongCount - a.wrongCount);
    }

    function renderJoinScreen() {
      const selectedGroup = state.groups.find(item => item.id === state.selectedGroupId) || state.groups[0];
      const curRunner = state.myRunnerNo || 1;
      return `
        <div class="max-w-3xl w-full mx-auto my-auto bg-slate-900/95 border border-slate-700/80 rounded-3xl p-6 md:p-8 shadow-2xl">
          <div class="text-xs font-black tracking-widest text-amber-300 uppercase mb-1">
            TABLET GROUP MODE · 五年級多步驟計算
          </div>
          <h1 class="text-2xl md:text-3xl font-black text-white mb-2">
            📱 平板組別版：選擇你的組別與棒次
          </h1>
          <p class="text-slate-300 text-sm mb-6">
            選定組別與棒次後按下「進入挑戰」，等大屏開始後依棒次輪流作答。
          </p>

          <div class="mb-6">
            <div class="text-base font-black text-white mb-3">1. 選擇所屬組別</div>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
              ${state.groups.map(g => {
                const active = g.id === selectedGroup.id;
                return `
                  <button
                    type="button"
                    onclick="state.selectedGroupId = ${g.id}; render();"
                    class="p-3.5 rounded-2xl border-2 text-left transition cursor-pointer ${
                      active
                        ? 'bg-amber-400/20 border-amber-400 text-white shadow-lg'
                        : 'bg-slate-800/80 border-slate-700 text-slate-200 hover:border-slate-500'
                    }"
                  >
                    <div class="font-black text-base">${g.name}</div>
                    <div class="text-xs text-slate-300 mt-0.5">${g.team}</div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="mb-6">
            <div class="text-base font-black text-white mb-3">2. 選擇你的棒次</div>
            <div class="grid grid-cols-3 sm:grid-cols-6 gap-2.5">
              ${Array.from({ length: 6 }, (_, i) => i + 1).map(num => {
                const isPicked = curRunner === num;
                return `
                  <button
                    type="button"
                    onclick="state.myRunnerNo = ${num}; render();"
                    class="py-3 rounded-xl border-2 font-black text-sm transition cursor-pointer ${
                      isPicked
                        ? 'bg-emerald-400 text-slate-950 border-emerald-300 shadow-md'
                        : 'bg-slate-800 text-slate-200 border-slate-700 hover:border-slate-500'
                    }"
                  >
                    第 ${num} 棒
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="mb-6">
            <label class="block text-sm font-bold text-slate-300 mb-2">3. 你的座號或名字（選填）</label>
            <input
              type="text"
              value="${state.playerLabel || ''}"
              oninput="state.playerLabel = this.value;"
              placeholder="例如：05 號 或 小明"
              class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-white font-bold focus:outline-none focus:border-amber-400"
            />
          </div>

          <button
            type="button"
            onclick="enterTabletBattle(state.selectedGroupId, state.myRunnerNo || 1, state.playerLabel);"
            class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black text-lg shadow-xl transition cursor-pointer"
          >
            🚀 進入挑戰（${selectedGroup.name} · 第 ${curRunner} 棒）
          </button>
        </div>
      `;
    }
    function renderTabletBattle() {
      try {
        const g = (Array.isArray(state.groups) ? (state.groups.find(function (item) { return item.id === state.selectedGroupId; }) || state.groups[0]) : null);
        if (!g) {
          return '<div class="max-w-xl w-full mx-auto bg-slate-900 text-white p-6 rounded-2xl">正在載入小組資料...</div>';
        }
        const now = Date.now();
        const isFrozen = (g.freezeUntil || 0) > now;
        const myRunner = Number(state.myRunnerNo || 1);
        const curRunner = Number(g.currentRunner || 1);
        const isMyTurnRunner = myRunner === curRunner;
        const eliminatedList = Array.isArray(g.eliminatedOptions) ? g.eliminatedOptions : [];
        const optionsList = (g.question && Array.isArray(g.question.shuffledOptions))
          ? g.question.shuffledOptions
          : ((g.question && Array.isArray(g.question.options)) ? g.question.options : []);

        const stars = Math.max(1, Math.min(5, Number((g.question && g.question.stars) || 1)));
        const starIcons = '\u2605'.repeat(stars) + '\u2606'.repeat(5 - stars);
        const starTable = (typeof STAR_BASE_DAMAGE === 'object' && STAR_BASE_DAMAGE) ? STAR_BASE_DAMAGE : null;
        const baseScore = Number((starTable && starTable[stars]) ? starTable[stars] : stars * 100);

        const groupCombo = Number(g.combo || 0);
        const comboMult = 1 + Math.min(groupCombo, 5) * 0.05;

        const elapsedSec = (g.question && g.question.startedAt)
          ? Math.max(0, (now - Number(g.question.startedAt)) / 1000)
          : 0;
        const speedInfo = (typeof getSpeedMultiplier === 'function' && g.question && g.question.startedAt)
          ? getSpeedMultiplier(g.question.startedAt)
          : { mult: 1, label: '\u6a19\u6e96\u4f5c\u7b54' };
        const speedMult = Number(speedInfo && speedInfo.mult ? speedInfo.mult : 1);
        const speedLabel = (speedInfo && speedInfo.label) ? speedInfo.label : (speedMult > 1 ? '\u795e\u901f\u4f5c\u7b54' : '\u7a69\u5b9a\u4f5c\u7b54');

        const maxSpeedWindowSec = 15;
        const speedBarPct = Math.max(8, Math.min(100, Math.round(((maxSpeedWindowSec - Math.min(maxSpeedWindowSec, elapsedSec)) / maxSpeedWindowSec) * 100)));
        const estimatedDmg = Math.round(baseScore * speedMult * comboMult);

        let statusBanner = '';
        if (!state.started) {
          statusBanner = '<div class="mb-4 px-4 py-3 rounded-2xl bg-amber-500/20 border border-amber-400/50 text-amber-200 text-sm font-black text-center">\u23f3 \u5c1a\u672a\u958b\u59cb\uff1a\u8acb\u7b49\u5927\u5c4f\u6309\u4e0b\u300c\u958b\u59cb\u5c0d\u6230\u300d\u5f8c\u518d\u4f5c\u7b54\uff08\u4f60\u662f\u7b2c ' + myRunner + ' \u68d2\uff09</div>';
        } else if (!isMyTurnRunner) {
          statusBanner = '<div class="mb-4 px-4 py-3 rounded-2xl bg-sky-500/20 border border-sky-400/50 text-sky-200 text-sm font-black text-center">\ud83d\udc40 \u53ea\u80fd\u770b\u984c\uff1a\u4f60\u662f\u7b2c ' + myRunner + ' \u68d2\uff0c\u76ee\u524d\u7531\u300c\u7b2c ' + curRunner + ' \u68d2\u300d\u4f5c\u7b54</div>';
        } else {
          statusBanner = '<div class="mb-4 px-4 py-2 rounded-2xl bg-emerald-500/15 border border-emerald-400/40 text-emerald-200 text-xs font-black text-center">\u2694\ufe0f \u8f2a\u5230\u4f60\u4f5c\u7b54\uff1a\u4f60\u662f\u7b2c ' + myRunner + ' \u68d2</div>';
        }

        const speedFillClass = speedMult > 1 ? 'bg-gradient-to-r from-cyan-400 via-sky-400 to-emerald-400' : 'bg-slate-500';
        const speedTextClass = speedMult > 1 ? 'text-cyan-300' : 'text-slate-300';

        const bonusAndSpeedPanel =
          '<div class="mb-4 space-y-2.5">' +
            '<div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">' +
              '<div class="px-3.5 py-2.5 rounded-2xl bg-amber-500/15 border border-amber-400/40 flex items-center justify-between"><span class="text-xs font-black text-amber-200">\ud83d\udd25 \u5c0f\u7d44\u9023\u64ca</span><span class="text-sm font-black text-amber-300">' + groupCombo + ' \u9023\u64ca\uff08\u00d7' + comboMult.toFixed(2) + '\uff09</span></div>' +
              '<div class="px-3.5 py-2.5 rounded-2xl bg-emerald-500/15 border border-emerald-400/40 flex items-center justify-between"><span class="text-xs font-black text-emerald-200">\ud83c\udfaf \u9810\u4f30\u672c\u984c\u5f97\u5206</span><span class="text-sm font-black text-emerald-300">\u7d04 ' + estimatedDmg.toLocaleString() + ' \u5206</span></div>' +
            '</div>' +
            '<div class="px-3.5 py-2.5 rounded-2xl bg-slate-800/85 border border-slate-700">' +
              '<div class="flex items-center justify-between text-xs font-black mb-1.5"><span class="' + speedTextClass + '">\u26a1 ' + speedLabel + '\uff08\u795e\u901f \u00d7' + speedMult.toFixed(2) + '\uff09</span><span class="text-slate-400">\u5df2\u904e ' + elapsedSec.toFixed(1) + ' \u79d2</span></div>' +
              '<div class="w-full h-2.5 bg-slate-950 rounded-full overflow-hidden border border-slate-700/80"><div style="width: ' + speedBarPct + '%" class="h-full transition-all duration-300 ' + speedFillClass + '"></div></div>' +
            '</div>' +
          '</div>';

        const optionsHtml = optionsList.map(function (opt, idx) {
          const letter = ['A', 'B', 'C', 'D'][idx] || String(idx + 1);
          const isEliminated = eliminatedList.includes(opt);
          const isOptionDisabled = Boolean(!state.started || isEliminated || isFrozen || state.paused || !isMyTurnRunner);
          const btnClass = isOptionDisabled
            ? 'bg-slate-900/50 border-slate-800 text-slate-500 opacity-50 cursor-not-allowed'
            : ('bg-slate-800/95 border-slate-600 text-white ' + (g.btnHover || 'hover:border-amber-400') + ' active:scale-[0.98] cursor-pointer');
          return '<button type="button" onclick="handleTabletAnswer(' + opt + ')" ' + (isOptionDisabled ? 'disabled' : '') + ' class="w-full flex items-center justify-between px-4 py-4 md:py-5 rounded-2xl border-2 font-black transition ' + btnClass + '"><span class="text-base md:text-lg px-2.5 py-1 rounded-lg bg-slate-950/80 text-slate-300 mr-3 shrink-0">' + letter + '</span><span class="text-3xl sm:text-4xl md:text-5xl flex-1 text-center leading-none">' + opt + '</span></button>';
        }).join('');

        const qCategory = (g.question && g.question.category) ? g.question.category : '\u8a08\u7b97\u984c';
        const qText = (g.question && g.question.text) ? g.question.text : '\u7b49\u5f85\u984c\u76ee\u8f09\u5165\u4e2d...';
        const playerPrefix = state.playerLabel ? ('\u9078\u624b\uff1a' + state.playerLabel + ' \u00b7 ') : '';

        return '<div class="max-w-4xl w-full mx-auto flex-1 flex flex-col justify-between gap-4">' +
          '<div class="bg-slate-900/95 border-2 ' + (g.border || 'border-slate-700') + ' rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 shadow-xl"><div class="flex items-center gap-3"><span class="px-3 py-1 rounded-xl ' + (g.badgeBg || 'bg-indigo-600') + ' text-white font-black text-base md:text-lg">' + g.name + ' \u00b7 ' + g.team + '</span><div><div class="text-xs text-slate-300 font-bold">' + playerPrefix + '\u7b2c ' + myRunner + ' \u68d2\uff08\u76ee\u524d\u7b2c ' + curRunner + ' \u68d2\uff09</div><div class="text-xl md:text-2xl font-black text-rose-400">\u2694\ufe0f \u672c\u7d44\u8f38\u51fa\uff1a' + Number(g.damage || 0).toLocaleString() + ' \u9ede</div></div></div><button type="button" onclick="finishBattleNow();" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs md:text-sm font-black cursor-pointer">\ud83d\udcca \u7d50\u7b97\u6230\u7e3e</button></div>' +
          '<div class="bg-slate-900/95 border border-slate-700/80 rounded-3xl p-5 md:p-7 flex-1 flex flex-col justify-between shadow-2xl"><div class="mb-5"><div class="flex flex-wrap items-center justify-between gap-2 mb-2"><span class="text-xs font-black text-amber-300 uppercase tracking-wider">' + qCategory + '</span><div class="flex items-center gap-2"><span class="px-2.5 py-1 rounded-lg bg-amber-500/20 border border-amber-400/40 text-amber-200 text-xs font-black">\u96e3\u5ea6 ' + starIcons + '\uff08' + stars + ' \u661f\uff09</span><span class="px-2.5 py-1 rounded-lg bg-rose-500/20 border border-rose-400/40 text-rose-200 text-xs font-black">\u57fa\u790e ' + baseScore + ' \u5206</span></div></div><div class="text-2xl sm:text-3xl md:text-4xl font-black text-white leading-relaxed break-words">' + qText + '</div></div>' +
          bonusAndSpeedPanel + statusBanner +
          '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4">' + optionsHtml + '</div></div></div>';
      } catch (err) {
        console.error('renderTabletBattle error:', err);
        return '<div class="max-w-xl w-full mx-auto bg-slate-900 border border-rose-500/50 text-rose-200 p-6 rounded-2xl font-bold">畫面渲染錯誤：' + String(err && err.message ? err.message : err) + '</div>';
      }
    }

            function renderSummary() {
      const sorted = [...state.groups].sort((a, b) => (b.damage || 0) - (a.damage || 0));
      const champion = sorted[0] || state.groups[0];
      const totalDmg = state.groups.reduce((acc, item) => acc + (item.damage || 0), 0);
      return `
        <div class="max-w-3xl w-full mx-auto my-auto bg-slate-900/95 border border-amber-400/50 rounded-3xl p-6 md:p-8 shadow-2xl text-white">
          <div class="text-xs font-black tracking-widest text-amber-300 uppercase mb-1">BATTLE SUMMARY</div>
          <h1 class="text-2xl md:text-3xl font-black mb-2">🏆 怪物已被擊倒！對戰結算</h1>
          <p class="text-sm text-slate-300 mb-6">
            最高輸出隊伍：<span class="text-amber-300 font-black">${champion ? `${champion.name}（${champion.team}）` : '無'}</span> · 總傷害：<span class="text-emerald-300 font-black">${totalDmg.toLocaleString()}</span> 點
          </p>
          <div class="space-y-2.5 mb-6">
            ${sorted.map((grp, idx) => `
              <div class="flex items-center justify-between px-4 py-3 rounded-2xl border ${idx === 0 ? 'bg-amber-500/15 border-amber-400/60' : 'bg-slate-800/80 border-slate-700'}">
                <div class="font-black">
                  <span class="text-amber-300 mr-2">#${idx + 1}</span>
                  <span>${grp.name}（${grp.team}）</span>
                </div>
                <div class="text-right">
                  <span class="font-black text-emerald-300">${(grp.damage || 0).toLocaleString()} 點</span>
                  <span class="text-xs text-slate-400 ml-2">答對 ${grp.correctCount || 0} 題</span>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="flex flex-wrap gap-3">
            <button type="button" onclick="state.showSummary = false; render();"
              class="flex-1 py-3.5 px-5 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-slate-600 font-black transition cursor-pointer">
              查看對戰畫面
            </button>
            <button type="button" onclick="resetTabletBattle(); render();"
              class="flex-1 py-3.5 px-5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black transition cursor-pointer">
              重新準備挑戰
            </button>
          </div>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById('app');
      if (state.ended) {
        root.innerHTML = renderSummary();
      } else if (!state.joined) {
        root.innerHTML = renderJoinScreen();
      } else {
        root.innerHTML = renderTabletBattle();
      }
    }

    let lastRenderSig = '';
    function renderIfChanged() {
      const g = state.groups.find(item => item.id === state.selectedGroupId) || state.groups[0];
      const sig = [
        state.joined ? 1 : 0,
        state.started ? 1 : 0,
        state.paused ? 1 : 0,
        state.ended ? 1 : 0,
        state.showSummary ? 1 : 0,
        state.hp,
        state.myRunnerNo,
        g ? g.currentRunner : 0,
        g ? g.damage : 0,
        g ? (g.combo || 0) : 0,
        g && g.question && g.question.startedAt ? Math.floor((Date.now() - g.question.startedAt) / 1000) : 0,
        g && g.question ? (g.question.id || g.question.text) : '',
        (g && g.eliminatedOptions) ? g.eliminatedOptions.join(',') : '',
        state.ultimateAlert || ''
      ].join('|');
      if (sig !== lastRenderSig) {
        lastRenderSig = sig;
        render();
      }
    }

    setInterval(() => {
      if (state.joined && !state.ended && !state.paused && !isTabletControlFocused()) {
        renderIfChanged();
      }
    }, 800);

    render();
    const ROOM_ID = (new URLSearchParams(window.location.search).get('room') || '506').trim() || '506';

    function isTabletControlFocused() {
      const active = document.activeElement;
      if (!active) return false;
      return active.tagName === 'SELECT' || active.tagName === 'INPUT' || active.tagName === 'TEXTAREA';
    }

    function syncGroupQuestionToServer(grp) {
      if (!grp || !grp.question) return Promise.resolve();
      const payloadQuestion = Object.assign({}, grp.question, {
        runner: grp.currentRunner || 1,
      });
      return fetch('/api/battle-room', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          room: ROOM_ID,
          action: 'syncQuestion',
          teamIndex: grp.id - 1,
          question: payloadQuestion,
          eliminatedOptions: grp.eliminatedOptions || [], combo: Number(grp.combo || 0),
        }),
      }).catch(() => {});
    }

    function applyServerRoomStateToTablet(data) {
      const keepJoined = Boolean(state.joined);
      if (!data || !Array.isArray(data.teams)) return;
      state.maxHp = Number(data.maxHp ?? state.maxHp ?? 10000);
      state.hp = Number(data.hp ?? state.hp);
      if (typeof setPausedState === 'function') {
        setPausedState(Boolean(data.paused));
      } else {
        state.paused = Boolean(data.paused);
      }
      state.started = Boolean(data.started);
      state.ended = Boolean(data.ended);
      if (keepJoined && !state.ended) { state.joined = true; }
      data.teams.forEach((t, idx) => {
        const g = state.groups[idx];
        if (!g) return;
        g.damage = Number(t.damage ?? g.damage ?? 0);
        if (t.combo !== undefined && t.combo !== null) { g.combo = Number(t.combo || 0); }
        g.runnerCount = 6;
        const serverRunner = Number(t.runner ?? 1);
        if (serverRunner >= 1 && serverRunner <= 6) {
          g.currentRunner = serverRunner;
        }
        if (t.question && typeof t.question === 'object' && t.question.text) {
          const sameQ = g.question && g.question.id === t.question.id && g.question.text === t.question.text;
          g.question = Object.assign({}, t.question, {
            startedAt: sameQ && g.question.startedAt ? g.question.startedAt : (t.question.startedAt || Date.now()),
          });
          g.eliminatedOptions = Array.isArray(t.eliminatedOptions) ? t.eliminatedOptions : [];
        } else if (state.started && g.question && (state.myRunnerNo || 1) === (g.currentRunner || 1)) {
          syncGroupQuestionToServer(g);
        }
      });
    }

    async function syncTabletRoom() {
      try {
        const res = await fetch('/api/battle-room?room=' + encodeURIComponent(ROOM_ID), {
          cache: 'no-store',
        });
        if (!res.ok) return;
        const data = await res.json();
        applyServerRoomStateToTablet(data);
        if (state.joined && !isTabletControlFocused()) {
          render();
        }
      } catch (err) {
        console.error('Tablet sync error:', err);
      }
    }

    async function sendTabletHitToServer(groupId, damage, advanceRunner) {
      try {
        const grp = state.groups.find(item => item.id === groupId);
        const res = await fetch('/api/battle-room', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            room: ROOM_ID,
            action: 'hit',
            teamIndex: groupId - 1,
            damage: damage,
            advanceRunner: Boolean(advanceRunner),
            runnerCount: 6, combo: grp ? Number(grp.combo || 0) : 0,
            question: grp ? grp.question : null,
            eliminatedOptions: grp ? (grp.eliminatedOptions || []) : [],
          }),
        });
        if (res.ok) {
          const data = await res.json();
          const localQ = grp ? grp.question : null;
          applyServerRoomStateToTablet(data);
          // 若後端尚未帶回剛抽出的新題目，保留本機最新題目並補同步
          if (grp && localQ && (!data.teams || !data.teams[groupId - 1] || !data.teams[groupId - 1].question)) {
            grp.question = localQ;
            await syncGroupQuestionToServer(grp);
          }
          if (state.joined && !isTabletControlFocused()) {
            render();
          }
        }
      } catch (err) {
        console.error('Tablet hit sync error:', err);
      }
    }

    if (typeof handleTabletAnswer === 'function') {
      const _origHandleTabletAnswer = handleTabletAnswer;
      window.handleTabletAnswer = function (chosenValue) {
        const g = state.groups.find(item => item.id === state.selectedGroupId);
        const prevDamage = g ? g.damage : 0;
        const prevRunner = g ? g.currentRunner : 1;
        const isCorrect = g && g.question && chosenValue === g.question.answer;

        _origHandleTabletAnswer(chosenValue);

        if (g && isCorrect) {
          const deltaDmg = Math.max(0, g.damage - prevDamage);
          const didAdvance = g.currentRunner !== prevRunner;
          sendTabletHitToServer(g.id, deltaDmg, didAdvance);
        }
      };
    }

    syncTabletRoom();
    setInterval(syncTabletRoom, 1500);
  </script>
</body>
</html>
